name: Build portable Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Test Python engine
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Build desktop app
        shell: cmd
        run: build.cmd

      - name: Assemble portable runtime
        shell: pwsh
        run: |
          $package = "dist/AutoElectiveOrb"
          New-Item -ItemType Directory -Force "$package/runtime/Lib/site-packages" | Out-Null
          Copy-Item AutoElectiveOrb.exe,README.md,LICENSE,THIRD_PARTY_NOTICES.md,run.cmd -Destination $package
          Copy-Item engine -Destination $package -Recurse
          Invoke-WebRequest "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip" -OutFile "python-embed.zip"
          Expand-Archive "python-embed.zip" -DestinationPath "$package/runtime"
          @("python312.zip", ".", "Lib/site-packages", "import site") | Set-Content "$package/runtime/python312._pth" -Encoding ascii
          python -m pip install --target "$package/runtime/Lib/site-packages" -r requirements.txt
          Get-ChildItem $package -Directory -Filter __pycache__ -Recurse | Remove-Item -Recurse -Force
          Compress-Archive "$package/*" "dist/AutoElectiveOrb-windows-x64.zip" -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: AutoElectiveOrb-windows-x64
          path: dist/AutoElectiveOrb-windows-x64.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoElectiveOrb-windows-x64.zip
          generate_release_notes: true
