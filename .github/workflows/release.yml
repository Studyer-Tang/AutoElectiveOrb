name: Build portable Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Test Python engine
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Build desktop app
        shell: cmd
        run: build.cmd

      - name: Report release signing status
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Warning "This release will be published unsigned. Windows may show an unknown-publisher warning."
          } else {
            "A signing certificate is configured; both executables will be signed and verified."
          }

      - name: Import code-signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            "No signing certificate configured; this non-release build will remain unsigned."
            return
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required when a certificate is configured."
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "AutoElectiveOrb-codesign.pfx"
          try {
            $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          } catch {
            throw "WINDOWS_CERTIFICATE_BASE64 is not valid Base64."
          }
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)

          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $signingCertificate = $imported | Where-Object {
            $_.HasPrivateKey -and
            ($_.EnhancedKeyUsageList.ObjectId.Value -contains "1.3.6.1.5.5.7.3.3")
          } | Select-Object -First 1
          if (-not $signingCertificate) {
            throw "The PFX does not contain a private-key certificate valid for code signing."
          }

          "SIGNING_CERT_THUMBPRINT=$($signingCertificate.Thumbprint)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNING_CERT_PATH=$certificatePath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign and verify executable
        shell: pwsh
        env:
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_THUMBPRINT)) {
            "Signing skipped for this non-release build."
            return
          }

          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object FullName -Match '\\x64\\signtool\.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) {
            throw "signtool.exe was not found on the GitHub-hosted Windows runner."
          }

          $timestampUrl = $env:WINDOWS_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestampUrl)) {
            $timestampUrl = "http://timestamp.digicert.com"
          }

          foreach ($executable in @("AutoElectiveOrb.exe", "UninstallAutoElectiveOrb.exe")) {
            & $signTool sign /sha1 $env:SIGNING_CERT_THUMBPRINT /fd SHA256 /tr $timestampUrl /td SHA256 $executable
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for $executable with exit code $LASTEXITCODE." }

            & $signTool verify /pa /all /v $executable
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $executable with exit code $LASTEXITCODE." }

            $signature = Get-AuthenticodeSignature $executable
            if ($signature.Status -ne "Valid") {
              throw "Authenticode verification failed for $executable with status: $($signature.Status)."
            }
            "Signed $executable by: $($signature.SignerCertificate.Subject)"
          }

      - name: Assemble portable runtime
        shell: pwsh
        run: |
          $package = "dist/AutoElectiveOrb"
          New-Item -ItemType Directory -Force "$package/runtime/Lib/site-packages" | Out-Null
          Copy-Item AutoElectiveOrb.exe,UninstallAutoElectiveOrb.exe,README.md,LICENSE,THIRD_PARTY_NOTICES.md,run.cmd -Destination $package
          Copy-Item engine -Destination $package -Recurse
          Copy-Item assets -Destination $package -Recurse
          Invoke-WebRequest "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip" -OutFile "python-embed.zip"
          Expand-Archive "python-embed.zip" -DestinationPath "$package/runtime"
          @("python312.zip", ".", "../engine", "Lib/site-packages", "import site") | Set-Content "$package/runtime/python312._pth" -Encoding ascii
          python -m pip install --target "$package/runtime/Lib/site-packages" -r requirements.txt
          & "$package/runtime/python.exe" -m compileall -q "$package/engine"
          & "$package/runtime/python.exe" -c "import elective_orb_core; print('Portable engine import OK')"
          if ($LASTEXITCODE -ne 0) { throw "The portable runtime cannot import the bundled engine." }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_THUMBPRINT)) {
            "This build is not Authenticode-signed. Windows may display an unknown-publisher warning." | Set-Content "$package/UNSIGNED_BUILD.txt" -Encoding utf8
          }
          Compress-Archive "$package/*" "dist/AutoElectiveOrb-windows-x64.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "dist/AutoElectiveOrb-windows-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AutoElectiveOrb-windows-x64.zip" | Set-Content "dist/AutoElectiveOrb-windows-x64.zip.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: AutoElectiveOrb-windows-x64
          path: |
            dist/AutoElectiveOrb-windows-x64.zip
            dist/AutoElectiveOrb-windows-x64.zip.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AutoElectiveOrb-windows-x64.zip
            dist/AutoElectiveOrb-windows-x64.zip.sha256
          generate_release_notes: true

      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_THUMBPRINT)) {
            $certificate = "Cert:\CurrentUser\My\$env:SIGNING_CERT_THUMBPRINT"
            if (Test-Path $certificate) {
              Remove-Item $certificate -Force
            }
          }
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PATH) -and (Test-Path $env:SIGNING_CERT_PATH)) {
            Remove-Item $env:SIGNING_CERT_PATH -Force
          }
